<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Idol — OBS Live Talking Head Overlay (Level 3)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Container for OBS Source */
    .avatar-container {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 380px;
      height: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    /* Avatar Canvas Wrapper with dynamic aura glow */
    .avatar-frame {
      position: relative;
      width: 320px;
      height: 380px;
      border-radius: 24px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #1a1a2e 0%, #0d0d18 80%);
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }

    .avatar-frame.speaking {
      border-color: rgba(191, 90, 242, 0.8);
      box-shadow: 0 0 35px rgba(191, 90, 242, 0.4), 0 12px 40px rgba(0, 0, 0, 0.6);
    }

    canvas#avatar-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Idol Tag */
    .avatar-tag {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 5px;
      z-index: 5;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #30d158;
      border-radius: 50%;
      box-shadow: 0 0 6px #30d158;
    }

    /* Karaoke Subtitle Box */
    .subtitle-box {
      margin-top: 10px;
      width: 100%;
      min-height: 48px;
      background: rgba(10, 10, 16, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .subtitle-box.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .sub-text {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.35;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <div class="avatar-container">
    <div class="avatar-frame" id="avatar-frame">
      <div class="avatar-tag">
        <span class="live-dot"></span>
        <span id="idol-tag-name">MIMI AI IDOL</span>
      </div>
      <canvas id="avatar-canvas" width="640" height="760"></canvas>
    </div>

    <div class="subtitle-box" id="subtitle-box">
      <div class="sub-text" id="sub-text"></div>
    </div>
  </div>

  <script>
    // ── Level 3 Realtime Avatar Canvas Renderer ─────────────
    const canvas = document.getElementById('avatar-canvas');
    const ctx = canvas.getContext('2d');
    const frameEl = document.getElementById('avatar-frame');
    const subBox = document.getElementById('subtitle-box');
    const subText = document.getElementById('sub-text');

    let customAvatarImg = null;
    let activePreset = 'mimi_anime';

    let currentPose = {
      mouthOpen: 0,
      mouthWide: 0.3,
      mouthPucker: 0,
      jawOpen: 0,
      smile: 0.3,
      eyeBlinkLeft: 0,
      eyeBlinkRight: 0,
      headPitch: 0,
      headYaw: 0,
      headRoll: 0,
      viseme: 'sil',
      currentWord: '',
      isSpeaking: false,
    };

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function setCustomImage(url) {
      if (!url) {
        customAvatarImg = null;
        return;
      }
      const img = new Image();
      img.onload = () => { customAvatarImg = img; };
      img.src = url;
    }

    // ── Avatar Render Loop (60 FPS) ─────────────────────────
    function renderAvatar(now) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const tSec = now / 1000;
      const offsetX = Math.sin(tSec * 1.5) * 6 + currentPose.headYaw * 3.5;
      const offsetY = Math.cos(tSec * 2.0) * 4 + currentPose.headPitch * 3.0;
      const rollRad = (currentPose.headRoll * Math.PI) / 180;

      // ── Mode A: Custom Uploaded Image ──
      if (customAvatarImg && customAvatarImg.complete && customAvatarImg.naturalWidth > 0) {
        ctx.save();
        ctx.translate(w / 2 + offsetX * 0.4, h / 2 + offsetY * 0.4);
        ctx.rotate(rollRad * 0.4);

        const imgRatio = customAvatarImg.naturalWidth / customAvatarImg.naturalHeight;
        const canvasRatio = w / h;
        let dw, dh, dx, dy;
        if (imgRatio > canvasRatio) {
          dh = h;
          dw = h * imgRatio;
          dx = -dw / 2;
          dy = -dh / 2;
        } else {
          dw = w;
          dh = w / imgRatio;
          dx = -dw / 2;
          dy = -dh / 2;
        }

        ctx.drawImage(customAvatarImg, dx, dy, dw, dh);
        // Custom avatars accept only real composited LiveTalking/MuseTalk pixels.
        // Painting a second synthetic mouth here caused the visible vector-lip bug.
        ctx.restore();

        requestAnimationFrame(renderAvatar);
        return;
      }

      // ── Mode B: Empty avatar state ──
      ctx.save();
      ctx.translate(w / 2, h / 2);

      // Background
      ctx.fillStyle = '#0f0f18';
      ctx.fillRect(-w / 2, -h / 2, w, h);

      // Dashed Outline Frame
      ctx.strokeStyle = 'rgba(191, 90, 242, 0.4)';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([8, 8]);
      ctx.strokeRect(-w / 2 + 10, -h / 2 + 10, w - 20, h - 20);
      ctx.setLineDash([]);

      // Silhouette Avatar Head & Shoulders
      ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.beginPath();
      ctx.arc(0, -25, 45, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(0, 65, 80, 45, 0, Math.PI, Math.PI * 2);
      ctx.fill();

      // Plus Badge Icon
      ctx.fillStyle = 'rgba(191, 90, 242, 0.85)';
      ctx.beginPath();
      ctx.arc(28, -6, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('+', 28, -6);

      // Text Prompt
      ctx.font = '600 20px Inter, system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.fillText('No avatar selected', 0, 115);

      ctx.font = '16px Inter, system-ui, sans-serif';
      ctx.fillStyle = 'rgba(191, 90, 242, 0.9)';
      ctx.fillText('Upload media in Dashboard', 0, 142);

      ctx.restore();

      requestAnimationFrame(renderAvatar);
      return;

      // ── Mode C: Vector Anime Presets ──
      ctx.save();
      ctx.translate(w / 2 + offsetX, h / 2 + 20 + offsetY);
      ctx.rotate(rollRad);

      const isCyber = activePreset === 'cyber_vtuber';
      const isKpop = activePreset === 'kpop_idol';

      // 1. Shoulders & Body
      ctx.fillStyle = isCyber ? '#00f0ff' : (isKpop ? '#e2c2ff' : '#ff79c6');
      ctx.beginPath();
      ctx.ellipse(0, 240, 190, 110, 0, 0, Math.PI * 2);
      ctx.fill();

      // Collar
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(-45, 160);
      ctx.lineTo(0, 210);
      ctx.lineTo(45, 160);
      ctx.closePath();
      ctx.fill();

      // 2. Neck
      ctx.fillStyle = '#ffe0bd';
      ctx.fillRect(-32, 100, 64, 70);

      // 3. Back Hair
      ctx.fillStyle = isCyber ? '#1a0933' : (isKpop ? '#2a1a15' : '#4a2840');
      ctx.beginPath();
      ctx.ellipse(0, 40, 145, 170, 0, 0, Math.PI * 2);
      ctx.fill();

      // 4. Head / Face Shape
      ctx.fillStyle = '#fff0e1';
      ctx.beginPath();
      ctx.moveTo(-85, -20);
      ctx.bezierCurveTo(-85, 90, -45, 130 + currentPose.jawOpen * 12, 0, 135 + currentPose.jawOpen * 16);
      ctx.bezierCurveTo(45, 130 + currentPose.jawOpen * 12, 85, 90, 85, -20);
      ctx.bezierCurveTo(85, -120, -85, -120, -85, -20);
      ctx.fill();

      // Blush
      ctx.fillStyle = 'rgba(255, 120, 140, 0.35)';
      ctx.beginPath();
      ctx.ellipse(-52, 42, 22, 12, -0.1, 0, Math.PI * 2);
      ctx.ellipse(52, 42, 22, 12, 0.1, 0, Math.PI * 2);
      ctx.fill();

      // 5. Eyes
      drawEye(-42, 8, currentPose.eyeBlinkLeft, currentPose.smile, isCyber ? '#00f0ff' : '#bf5af2');
      drawEye(42, 8, currentPose.eyeBlinkRight, currentPose.smile, isCyber ? '#00f0ff' : '#bf5af2');

      // Eyebrows
      ctx.strokeStyle = '#5a354c';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-60, -22 - currentPose.smile * 4);
      ctx.quadraticCurveTo(-42, -30 - currentPose.smile * 6, -24, -22);
      ctx.moveTo(24, -22);
      ctx.quadraticCurveTo(42, -30 - currentPose.smile * 6, 60, -22 - currentPose.smile * 4);
      ctx.stroke();

      // 6. Nose
      ctx.fillStyle = '#d98e71';
      ctx.beginPath();
      ctx.ellipse(0, 42, 3.5, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // 7. Dynamic Level 3 Mouth
      drawMouth(0, 75, currentPose);

      // 8. Front Hair / Bangs
      ctx.fillStyle = isCyber ? '#2e124d' : (isKpop ? '#3d261d' : '#5c3250');
      ctx.beginPath();
      ctx.moveTo(-90, -30);
      ctx.quadraticCurveTo(-45, -135, 0, -135);
      ctx.quadraticCurveTo(45, -135, 90, -30);
      ctx.lineTo(85, 20);
      ctx.quadraticCurveTo(45, -45, 20, -10);
      ctx.quadraticCurveTo(0, -50, -20, -10);
      ctx.quadraticCurveTo(-45, -45, -85, 20);
      ctx.closePath();
      ctx.fill();

      // Hair Ribbons / Cyber Ears
      ctx.fillStyle = isCyber ? '#00f0ff' : '#bf5af2';
      ctx.beginPath();
      ctx.moveTo(-65, -95);
      ctx.lineTo(-95, -150);
      ctx.lineTo(-40, -120);
      ctx.closePath();
      ctx.moveTo(65, -95);
      ctx.lineTo(95, -150);
      ctx.lineTo(40, -120);
      ctx.closePath();
      ctx.fill();

      ctx.restore();

      requestAnimationFrame(renderAvatar);
    }

    function drawEye(cx, cy, blink, smile, irisColor = '#bf5af2') {
      ctx.save();
      ctx.translate(cx, cy);

      if (blink > 0.6) {
        ctx.strokeStyle = '#2b1424';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0.2 * Math.PI, 0.8 * Math.PI, false);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(0, 0, 16, 20, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = irisColor;
        ctx.beginPath();
        ctx.ellipse(0, 1, 10, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1c0924';
        ctx.beginPath();
        ctx.arc(0, 2, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-4, -4, 4.5, 0, Math.PI * 2);
        ctx.arc(3, 4, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#2b1424';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(0, -2, 17, 1.15 * Math.PI, 1.85 * Math.PI);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawMouth(cx, cy, pose, sourceImg, dx, dy, dw, dh) {
      const open = Math.max(0, Math.min(1.2, pose.mouthOpen || 0));
      const wide = Math.max(0.2, Math.min(1.0, pose.mouthWide || 0.3));
      const pucker = pose.mouthPucker || 0;
      const smile = pose.smile || 0.3;

      if (open < 0.04) return; // Keep original closed mouth from photo

      const halfW = 14 + wide * 16 - pucker * 8;
      const halfH = open * 18;
      const smileCurv = smile * 6 - open * 3;

      ctx.save();
      ctx.translate(cx, cy);

      // Clip opening
      ctx.beginPath();
      ctx.moveTo(-halfW, -smileCurv * 0.4);
      ctx.quadraticCurveTo(0, -halfH * 0.35, halfW, -smileCurv * 0.4);
      ctx.quadraticCurveTo(halfW * 0.8, halfH * 0.95, 0, halfH * 1.1);
      ctx.quadraticCurveTo(-halfW * 0.8, halfH * 0.95, -halfW, -smileCurv * 0.4);
      ctx.closePath();
      ctx.clip();

      if (sourceImg && sourceImg.complete) {
        // Draw real photo texture
        ctx.drawImage(sourceImg, dx - cx, dy - cy, dw, dh);
      }

      // Soft natural oral cavity ambient shadow
      const grad = ctx.createRadialGradient(0, 0, 1, 0, halfH * 0.3, halfW * 0.85);
      grad.addColorStop(0, 'rgba(6, 1, 3, 0.92)');
      grad.addColorStop(0.55, 'rgba(20, 3, 8, 0.65)');
      grad.addColorStop(0.85, 'rgba(35, 6, 15, 0.25)');
      grad.addColorStop(1, 'rgba(45, 10, 20, 0)');

      ctx.fillStyle = grad;
      ctx.fillRect(-halfW * 1.5, -halfH * 1.5, halfW * 3.0, halfH * 3.0);

      ctx.restore();
    }

    // ── WebSocket Integration ───────────────────────────────
    function connectWebSocket() {
      const host = window.location.hostname || 'localhost';
      const port = window.location.port || '6767';
      const wsUrl = `ws://${host}:${port}`;

      const runtimeToken = sessionStorage.getItem('idol_runtime_auth_token') || new URLSearchParams(location.hash.slice(1)).get('token') || '';
      const protocols = runtimeToken
        ? ['idol-runtime', `auth.${btoa(runtimeToken).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '')}`]
        : undefined;
      const ws = protocols ? new WebSocket(wsUrl, protocols) : new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log('[OBS Overlay] Connected to Runtime Server');
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);

          if (data.type === 'AVATAR_UPDATED' || (data.type === 'SETTINGS_UPDATED' && data.settings?.avatar)) {
            const av = data.avatar || data.settings.avatar;
            if (av.customImageUrl) setCustomImage(av.customImageUrl);
            if (av.preset) activePreset = av.preset;
          } else if (data.type === 'TALKING_HEAD_FRAME' && data.frame) {
            const f = data.frame;
            currentPose.mouthOpen = lerp(currentPose.mouthOpen, f.mouthOpen, 0.45);
            currentPose.mouthWide = lerp(currentPose.mouthWide, f.mouthWide, 0.35);
            currentPose.mouthPucker = lerp(currentPose.mouthPucker, f.mouthPucker, 0.35);
            currentPose.jawOpen = lerp(currentPose.jawOpen, f.jawOpen, 0.45);
            currentPose.smile = lerp(currentPose.smile, f.smile, 0.2);
            currentPose.eyeBlinkLeft = f.eyeBlinkLeft;
            currentPose.eyeBlinkRight = f.eyeBlinkRight;
            if (f.headPose) {
              currentPose.headPitch = f.headPose.pitch;
              currentPose.headYaw = f.headPose.yaw;
              currentPose.headRoll = f.headPose.roll;
            }
            currentPose.viseme = f.viseme;
            currentPose.currentWord = f.currentWord;
            currentPose.isSpeaking = true;

            frameEl.classList.add('speaking');
          } else if (data.type === 'VOICE_EVENT') {
            if (data.event?.type === 'voice.started') {
              frameEl.classList.add('speaking');
              subBox.classList.add('visible');
              subText.textContent = data.event.text || '';
              // Play live audio in OBS browser source if provided
              if (data.event.audioBase64) {
                const aud = new Audio(`data:audio/mp3;base64,${data.event.audioBase64}`);
                aud.play().catch(() => {});
              } else if (data.event.audioUrl) {
                const aud = new Audio(data.event.audioUrl);
                aud.play().catch(() => {});
              }
            } else if (data.event?.type === 'voice.finished' || data.event?.type === 'voice.interrupted') {
              frameEl.classList.remove('speaking');
              setTimeout(() => subBox.classList.remove('visible'), 1200);
            }
          }
        } catch (err) {
          console.warn('[OBS Overlay] Message error:', err);
        }
      };

      ws.onclose = () => {
        setTimeout(connectWebSocket, 2500);
      };
    }

    connectWebSocket();
    requestAnimationFrame(renderAvatar);
  </script>
</body>
</html>
