[package]
name = "ai-idol-streamer"
version = "0.1.0"
description = "AI IDOL STREAMER desktop operator application"
authors = ["AI IDOL STREAMER"]
edition = "2021"

[lib]
name = "ai_idol_streamer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
